name: Pipeline Contract Check
description: "Lint-time contract validator for OWUI Pipeline files — asserts inlet/outlet/lifecycle hooks are async, Valves has the pipelines field, and __init__ assigns type/name/valves."
author: dvystrcil

inputs:
  paths:
    description: "Space-separated list of file paths OR glob patterns to check. Example: 'pipelines/**/*.py' or 'prompts/owui/filters/*.py'."
    required: true
  exclude:
    description: "Newline-separated `find` -path patterns to prune from discovery. Default excludes virtualenvs, caches, tests, and eval/ directories."
    required: false
    default: |
      */.venv
      *__pycache__*
      */eval/*
      */tests/*

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Discover + contract-check pipeline files
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
      run: |
        set -euo pipefail

        # Build the find -prune expression from the exclude input.
        prune_args=()
        while IFS= read -r pat; do
          [ -z "$pat" ] && continue
          if [ ${#prune_args[@]} -gt 0 ]; then
            prune_args+=("-o")
          fi
          prune_args+=("-path" "$pat")
        done <<< "$INPUT_EXCLUDE"

        # Expand the paths input.
        files=()
        # shellcheck disable=SC2206
        tokens=($INPUT_PATHS)
        for tok in "${tokens[@]}"; do
          if [ -f "$tok" ]; then
            files+=("$tok")
          elif [ -d "$tok" ]; then
            if [ ${#prune_args[@]} -gt 0 ]; then
              mapfile -t found < <(find "$tok" \( "${prune_args[@]}" \) -prune -o -name '*.py' -not -name 'test_*.py' -not -name 'conftest.py' -print | sort)
            else
              mapfile -t found < <(find "$tok" -name '*.py' -not -name 'test_*.py' -not -name 'conftest.py' -print | sort)
            fi
            files+=("${found[@]}")
          else
            case "$tok" in
              *\**) echo "  (no match for glob: $tok)" ;;
              *) echo "warning: $tok not a file/dir/glob, skipping" >&2 ;;
            esac
          fi
        done

        if [ ${#files[@]} -eq 0 ]; then
          echo "no pipeline files to contract-check"
          exit 0
        fi

        echo "Contract-checking ${#files[@]} file(s):"
        printf '  %s\n' "${files[@]}"
        echo

        python3 "${GITHUB_ACTION_PATH}/check_pipeline_contract.py" "${files[@]}"
